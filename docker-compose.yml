

services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/jobtracker
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - REDIS_HOST=redis
      - FRONTEND_URL=https://jobtracker.panarin.dev,http://localhost:3001,http://localhost:3002
    depends_on:
      - db
    command: sh -c "until nc -z db 5432; do sleep 1; done && npm run migrate && npm run dev"

  redis:
    image: redis:7-alpine
    ports:
    - "127.0.0.1:6379:6379"
    volumes:
    - redis_data:/data

  frontend:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ../job-tracker-client/build:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jobtracker
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:      
  postgres_data:
  redis_data:



  